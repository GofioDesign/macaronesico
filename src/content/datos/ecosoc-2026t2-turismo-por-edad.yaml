titulo: 'Percepción del turismo por grupos de edad (ECOSOC 2026 T2)'
descripcion: >-
  Porcentaje de acuerdo («de acuerdo» + «muy de acuerdo») con cada afirmación
  sobre el turismo, por grupo de edad. Población de 18 y más años residente en
  Canarias, segundo trimestre de 2026. La brecha es la diferencia en puntos entre
  el grupo de 18-34 años y el de 55 y más.
fuente: Instituto Canario de Estadística (ISTAC), Encuesta de Hábitos y Confianza Socioeconómica (ECOSOC)
url: https://www.gobiernodecanarias.org/istac/galerias/documentos/C00086A/ecosoc-2026Q2-percepcion-del-turismo-tablas.html
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Tablas oficiales del módulo de percepción del turismo publicadas en el
  catálogo de datos abiertos del ISTAC (consultas C00086A_000028, _000030,
  _000032 y _000036; conjuntos C00086A_000502 y _000516). Los totales coinciden
  con la nota de prensa del 22/09/2026. La columna de brecha es cálculo propio.
