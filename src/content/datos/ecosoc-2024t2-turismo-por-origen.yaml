titulo: 'Percepción del turismo según lugar de nacimiento (ECOSOC 2024 T2)'
descripcion: >-
  Porcentaje de acuerdo con afirmaciones sobre el turismo según el lugar de
  nacimiento: Canarias, otra comunidad autónoma u otro país.
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2024 T2)
url: https://datos.canarias.es/catalogos/estadisticas/dataset/microdatos-de-la-encuesta-de-habitos-y-confianza-socioeconomica-2024-segundo-trimestre
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Cálculo propio a partir de los microdatos públicos del módulo (2.233
  entrevistas), aplicando el peso oficial de cada entrevista. Entrevistas por
  grupo: nacidos en Canarias 1.619; en otra comunidad 176; en otro país 438.
