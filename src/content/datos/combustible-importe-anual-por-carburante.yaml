titulo: 'Lo que suma cada año la diferencia de precio antes de impuestos en Canarias, por carburante (2016-2025)'
descripcion: >-
  Importe anual que resulta de multiplicar los litros vendidos en Canarias por
  la diferencia del precio antes de impuestos con la Península y Baleares, para
  gasolina 95, gasolina 98 y diésel vendido en gasolineras.
fuente: CNMC (precios diarios provinciales) y CORES (consumos mensuales por provincia)
url: https://www.cores.es/
fecha: 2026-09-30
licencia: Datos de CNMC y CORES; elaboración de macaronesico (CC BY 4.0)
notas: >-
  Cálculo mensual: litros de CORES por diferencia media de PAI de la CNMC. El
  diésel se limita al 73 % que se vende en gasolineras (CNMC, IS/DE/010/20,
  pág. 5). Importes brutos: no son beneficio empresarial.
