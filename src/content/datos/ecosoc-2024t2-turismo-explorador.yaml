titulo: 'Encuesta de percepción del turismo por grupos: edad, ingresos, sexo, nacimiento, isla y vínculo con el turismo (ECOSOC 2024 T2)'
descripcion: >-
  Todas las preguntas del módulo de percepción del turismo de la ECOSOC (ISTAC,
  segundo trimestre de 2024) para cada combinación de edad, ingresos del hogar,
  sexo, lugar de nacimiento, isla y vínculo del hogar con el turismo.
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2024 T2)
url: https://datos.canarias.es/catalogos/estadisticas/dataset/microdatos-de-la-encuesta-de-habitos-y-confianza-socioeconomica-2024-segundo-trimestre
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
dimensiones: Edad, Ingresos del hogar, Sexo, Nacimiento, Isla, Hogar vinculado al turismo
notas: >-
  Calculado con scripts/istac/ecosoc-2024t2-turismo.mjs a partir de los
  microdatos públicos (2.233 entrevistas). Cada fila es un grupo: «Entrevistas»
  es el número de personas entrevistadas y «Peso», la suma de sus pesos
  oficiales. Cada columna de pregunta indica, entre paréntesis en la temática,
  qué respuestas cuenta: en las afirmaciones, «de acuerdo» y «muy de acuerdo»;
  en la dependencia, «alta» y «muy alta»; en la gestión pública, «buena» y «muy
  buena». El denominador son todas las entrevistas del grupo, también quien no
  sabe o no contesta, salvo en el destino y la cuantía de la tasa, que solo se
  preguntaron a quien la apoya: esas columnas tienen su propia base
  («Entrevistas · …» y «Peso · …»). Para obtener un grupo más amplio hay que
  promediar las filas ponderando por el peso correspondiente. Muchas
  combinaciones tienen muy pocas entrevistas y sus porcentajes no son
  representativos.
