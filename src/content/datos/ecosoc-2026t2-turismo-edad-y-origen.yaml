titulo: 'Percepción del turismo por edad y lugar de nacimiento (ECOSOC 2026 T2)'
descripcion: >-
  Porcentaje de acuerdo con afirmaciones sobre el turismo cruzando grupo de edad
  (18-34 y 55 y más) y lugar de nacimiento (Canarias o fuera).
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2026 T2)
url: https://www.gobiernodecanarias.org/istac/galerias/documentos/C00086A/ecosoc-2026Q2-percepcion-del-turismo-microdatos.html
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Cálculo propio a partir de los microdatos públicos, con el peso oficial de
  cada entrevista. Entrevistas por grupo: 18-34 nacidos en Canarias 331; 18-34
  nacidos fuera 103; 55 y más nacidos en Canarias 641; 55 y más nacidos fuera
  234. En los grupos pequeños el margen de error es amplio (unos ±10 puntos
  para los 103 jóvenes nacidos fuera).
