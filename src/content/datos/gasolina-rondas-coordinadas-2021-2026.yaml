titulo: 'Subidas y bajadas conjuntas de las grandes marcas de gasolina (2021-2026)'
descripcion: >-
  Número de semanas en que al menos tres de BP, Cepsa/Moeve, Repsol y Shell
  cambiaron el precio en la mitad o más de sus estaciones de un territorio, en
  el mismo sentido, entre enero de 2021 y septiembre de 2026.
fuente: Ministerio para la Transición Ecológica (MITECO), precios diarios por estación de servicio
url: https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/
fecha: 2026-09-29
licencia: Datos de MITECO; elaboración de macaronesico (CC BY 4.0)
notas: >-
  Un operador «se mueve» un día cuando al menos el 50 % de sus estaciones del
  territorio (mínimo tres) sube o baja el precio respecto al día anterior. Una
  ronda agrupa los movimientos de distintos operadores en una ventana de 7
  días y cuenta si participan al menos tres. Las islas sin rondas (La Palma,
  La Gomera, El Hierro, Fuerteventura) no tienen presencia suficiente de esas
  cuatro marcas.
