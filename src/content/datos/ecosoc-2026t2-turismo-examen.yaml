titulo: 'El examen del turismo: afirmaciones favorables por edad (ECOSOC 2026 T2)'
descripcion: >-
  Porcentaje de acuerdo con las 18 afirmaciones favorables al turismo de la
  encuesta, por grupo de edad y para los jóvenes nacidos en Canarias.
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2026 T2)
url: https://www.gobiernodecanarias.org/istac/galerias/documentos/C00086A/ecosoc-2026Q2-percepcion-del-turismo-microdatos.html
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Calculado con scripts/istac/ecosoc-2026t2-turismo.mjs. De las 28
  afirmaciones sobre el turismo de la encuesta, estas 18 le atribuyen un
  efecto positivo; las otras 10 hablan de efectos negativos (vivienda, empleo
  precario, tensiones, residuos…). Porcentaje de «de acuerdo» y «muy de
  acuerdo» sobre todas las entrevistas del grupo, con el peso oficial. Los
  datos por edad coinciden con las tablas publicadas por el ISTAC.
