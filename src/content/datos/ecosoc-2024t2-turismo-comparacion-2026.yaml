titulo: 'Percepción del turismo por edad en 2024 y 2026 (ECOSOC T2)'
descripcion: >-
  Porcentaje de acuerdo con cada afirmación sobre el turismo en las dos oleadas
  del módulo de percepción del turismo de la ECOSOC (segundo trimestre de 2024 y
  de 2026), en total y por grupo de edad.
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2024 T2 y 2026 T2)
url: https://datos.canarias.es/catalogos/estadisticas/dataset/microdatos-de-la-encuesta-de-habitos-y-confianza-socioeconomica-2024-segundo-trimestre
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Calculado con scripts/istac/ecosoc-2024t2-turismo.mjs con el mismo método en
  las dos oleadas (2.233 entrevistas en 2024 y 2.316 en 2026). Son muestras
  distintas: con este tamaño, una diferencia en el total de menos de unos 3
  puntos puede deberse al azar, y en cada grupo de edad el margen es mayor
  (unos 4 o 5 puntos).
