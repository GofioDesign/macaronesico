titulo: 'Percepción del turismo por edad, ingresos, sexo y lugar de nacimiento (ECOSOC 2026 T2)'
descripcion: >-
  Porcentaje de acuerdo con cada afirmación sobre el turismo para cada
  combinación de edad, ingresos del hogar, sexo y lugar de nacimiento. Es la
  base del explorador del artículo sobre la fractura generacional.
fuente: Elaboración de macaronesico a partir de los microdatos del ISTAC (ECOSOC 2026 T2)
url: https://www.gobiernodecanarias.org/istac/galerias/documentos/C00086A/ecosoc-2026Q2-percepcion-del-turismo-microdatos.html
fecha: 2026-09-26
licencia: CC BY 4.0 (datos del ISTAC); elaboración de macaronesico
notas: >-
  Calculado con scripts/istac/ecosoc-2026t2-turismo.mjs a partir de los
  microdatos públicos (2.316 entrevistas). Cada fila es un grupo: «Entrevistas»
  es el número de personas entrevistadas y «Peso», la suma de sus pesos
  oficiales. Los porcentajes cuentan «de acuerdo» y «muy de acuerdo» sobre
  todas las entrevistas del grupo (también quien no sabe o no contesta); en la
  tasa turística, «sí»; en la vivienda vacacional, «debería ser más estricta».
  Para obtener un grupo más amplio hay que promediar las filas ponderando por
  el peso. Muchas combinaciones tienen muy pocas entrevistas y sus porcentajes
  no son representativos.
