titulo: 'Gasolina 95 en Canarias: litros vendidos y lo que suma la diferencia de precio antes de impuestos (2016-2026)'
descripcion: >-
  Litros de gasolina 95 vendidos en Canarias cada año, diferencia media del
  precio antes de impuestos con Península y Baleares e importe que resulta de
  multiplicar ambos mes a mes.
fuente: CORES (consumos mensuales por provincia) y CNMC (precios diarios provinciales)
url: https://www.cores.es/
fecha: 2026-09-29
licencia: Datos de CORES y CNMC; elaboración de macaronesico (CC BY 4.0)
notas: >-
  Toneladas mensuales de CORES convertidas a litros con 0,745 kg/L. Para cada
  mes se multiplica el volumen por la diferencia media de PAI; la diferencia
  anual está ponderada por litros. El importe es bruto: no es beneficio
  empresarial. 2026 incluye nueve meses de volumen y precios hasta el 22/09.
