<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" role="img" aria-label="Suben juntas, bajan por separado">
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e0;
      --can:#eb6834; --pen:#2a78d6; --band:#eb683426; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f;
        --can:#d95926; --pen:#3987e5; --band:#d9592633; }
}
.bg { fill: var(--surface); } .t1 { fill: var(--ink); } .t2 { fill: var(--ink2); } .t3 { fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--muted); stroke-width: 1; }
.can { fill: var(--can); } .pen { fill: var(--pen); } .lcan { stroke: var(--can); } .lpen { stroke: var(--pen); }
.hit { fill: transparent; } .hit:hover + .dot, .bar:hover { opacity: .8; }
</style>
