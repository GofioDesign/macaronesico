name: Vista estática (temporal)

# Temporal: compila incluyendo borradores y guarda dist/ en la rama
# "vista-estatica" para revisar el HTML generado. Se puede borrar sin problema.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          CF_PAGES_BRANCH: vista
      - name: Publicar dist en la rama vista-estatica
        run: |
          cp -r dist /tmp/dist
          git config user.name "macaronesico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vista-estatica
          git rm -rfq . > /dev/null
          git clean -fdxq
          cp -r /tmp/dist/. .
          git add -A
          git commit -qm "Vista estática ${{ github.sha }}"
          git push -f origin vista-estatica
