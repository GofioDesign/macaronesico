name: Importar a la Biblioteca

# Al subir un listado a scripts/biblioteca/entrada/ (una referencia por línea,
# con doi:, titulo:, isbn: o buscar:), da de alta las fichas en la Biblioteca y
# deja un informe en scripts/biblioteca/informes/.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/biblioteca/entrada/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Procesar listados
        run: node scripts/biblioteca/procesar-entrada.mjs
      - name: Guardar fichas e informe
        run: |
          git config user.name "macaronesico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/biblioteca scripts/biblioteca
          if git diff --cached --quiet; then
            echo "Nada nuevo."
          else
            git commit -m "Biblioteca: importación de referencias"
            git pull --rebase
            git push
          fi
